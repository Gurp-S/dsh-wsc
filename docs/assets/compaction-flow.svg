<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="WSC compaction flow">
  <rect width="960" height="540" fill="#0f172a"/>
  <text x="48" y="56" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">WSC 压缩流程</text>
  <text x="48" y="84" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">事件按 seq 原样入库，压缩是一次可核对的发布</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="48" y="130" width="180" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="66" y="160" fill="#e2e8f0" font-size="16" font-weight="600">原文事件</text>
    <text x="66" y="186" fill="#94a3b8" font-size="13">消息 / 工具调用 / 结果</text>
    <text x="66" y="208" fill="#38bdf8" font-size="13">seq 只增不改</text>

    <rect x="276" y="130" width="180" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="294" y="160" fill="#e2e8f0" font-size="16" font-weight="600">固定快照</text>
    <text x="294" y="186" fill="#94a3b8" font-size="13">cut / 代次 / 控制版本</text>
    <text x="294" y="208" fill="#38bdf8" font-size="13">前缀变化即拒绝</text>

    <rect x="504" y="130" width="180" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="522" y="160" fill="#e2e8f0" font-size="16" font-weight="600">模型选材</text>
    <text x="522" y="186" fill="#94a3b8" font-size="13">entries / revise</text>
    <text x="522" y="208" fill="#38bdf8" font-size="13">唯一模型判定点</text>

    <rect x="732" y="130" width="180" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="750" y="160" fill="#e2e8f0" font-size="16" font-weight="600">逐条校验</text>
    <text x="750" y="186" fill="#94a3b8" font-size="13">引用存在 · 字面匹配</text>
    <text x="750" y="208" fill="#fbbf24" font-size="13">失败条目进 gaps</text>

    <rect x="276" y="300" width="180" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="294" y="330" fill="#e2e8f0" font-size="16" font-weight="600">候选视图</text>
    <text x="294" y="356" fill="#94a3b8" font-size="13">必留内容 + 字节预算</text>
    <text x="294" y="378" fill="#38bdf8" font-size="13">写入 ready</text>

    <rect x="504" y="300" width="180" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="522" y="330" fill="#e2e8f0" font-size="16" font-weight="600">宿主安装</text>
    <text x="522" y="356" fill="#94a3b8" font-size="13">同步边界内校验</text>
    <text x="522" y="378" fill="#38bdf8" font-size="13">confirmed / rejected</text>

    <rect x="732" y="300" width="180" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="750" y="330" fill="#e2e8f0" font-size="16" font-weight="600">检查点</text>
    <text x="750" y="356" fill="#94a3b8" font-size="13">compaction/summary</text>
    <text x="750" y="378" fill="#34d399" font-size="13">按 seq 可回查</text>

    <path d="M228 178 H276" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <path d="M456 178 H504" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <path d="M684 178 H732" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <path d="M822 226 V300" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <path d="M732 348 H684" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <path d="M504 348 H456" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

    <rect x="48" y="300" width="180" height="96" rx="10" fill="#111c33" stroke="#1d4ed8"/>
    <text x="66" y="330" fill="#e2e8f0" font-size="16" font-weight="600">窗口压力</text>
    <text x="66" y="356" fill="#94a3b8" font-size="13">容量 = min(可用, 256k)</text>
    <text x="66" y="378" fill="#38bdf8" font-size="13">80% 提示 / 80% 强制</text>
    <path d="M228 348 H276" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a)"/>

    <rect x="48" y="432" width="864" height="64" rx="10" fill="#182235" stroke="#334155"/>
    <text x="68" y="458" fill="#cbd5e1" font-size="14">压缩后：需求原文逐字保留 · 账本同 subject 只显示当前版本 · 状态行标注未验证 · 证据索引可按 seq 取回原始字节</text>
    <text x="68" y="480" fill="#94a3b8" font-size="13">read-dedupe 在压缩边界重置，压缩后第一次重读返回真实字节；失败或未知回执不会推进游标。</text>
  </g>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
